name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install nothing
        run: npm --version
      - name: Verify generated role and adapter artifacts
        run: npm run check
      - name: Regenerate tracked artifacts
        run: |
          set -eu
          node scripts/sync-roles.mjs
          node scripts/sync-adapters.mjs
      - name: Assert generated artifacts are committed
        run: git diff --exit-code -- .claude-plugin/agents .codex/agents .agents/agents adapters/registry.json
      - name: Run Node tests
        run: npm test
      - name: Run lint-style validators
        run: npm run lint
      - name: Validate Codex plugin
        run: npm run validate:codex-plugin
      - name: Validate Claude plugin
        run: npm run validate:claude-plugin
      - name: Shell syntax
        run: |
          set -eu
          find scripts -name '*.sh' -exec bash -n {} +
