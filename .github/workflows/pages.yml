name: pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate privacy scan
        run: node scripts/scan-privacy.mjs
      - name: Validate static site
        run: node scripts/validate-site.mjs
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-run privacy scan
        run: node scripts/scan-privacy.mjs
      - name: Re-run static site validation
        run: node scripts/validate-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
